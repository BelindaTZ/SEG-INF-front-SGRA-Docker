name: sgra

services:
  frontend:
    image: sgra-frontend:local
    build: .
    ports:
      - "127.0.0.1:${SGRA_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    image: sgra-backend:local
    build:
      context: ${SGRA_BACKEND_DIR:-../back-SGRA-Docker}
      args:
        PG_MAJOR: ${SGRA_PG_MAJOR:-18}
    env_file:
      - path: ${SGRA_BACKEND_ENV:-../back-SGRA-Docker/.env.docker}
        required: false
    volumes:
      - backend-backups:/var/lib/sgra/backups

volumes:
  backend-backups:
